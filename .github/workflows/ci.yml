name: CI/CD - Heart Disease MLOps

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: heart-disease-api

jobs:
  # ============================================================
  # Job 1: Lint - flake8, black --check, isort --check-only
  # ============================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install lint dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8==7.1.1 black==24.10.0 isort==5.13.2

      - name: flake8
        run: flake8 src tests

      - name: black --check
        run: black --check src tests

      - name: isort --check
        run: isort --check-only src tests

  # ============================================================
  # Job 2: Unit tests with pytest + coverage
  # ============================================================
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        run: |
          pytest --cov=src --cov-report=xml --cov-report=term tests/

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  # ============================================================
  # Job 3: Train the model on the real UCI dataset
  # ============================================================
  train:
    name: Train Model
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download dataset
        run: python -m src.download_data

      - name: Train models
        env:
          MLFLOW_TRACKING_URI: file:./mlruns
        run: python -m src.train

      - name: Verify trained artifact exists
        run: |
          test -s models/best_model.pkl
          test -s models/best_model_metadata.json
          cat models/best_model_metadata.json

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: |
            models/best_model.pkl
            models/best_model_metadata.json
            artifacts/training_summary.md
            artifacts/*.png
          retention-days: 30

      - name: Upload MLflow runs
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-runs
          path: mlruns/
          retention-days: 14

  # ============================================================
  # Job 4: Build Docker image (using the trained model artifact)
  # ============================================================
  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [train]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: .

      - name: Verify staged artifacts
        run: |
          test -s models/best_model.pkl
          test -s models/best_model_metadata.json
          ls -la models/ artifacts/ || true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Smoke-test the image
        run: |
          docker run -d --name api -p 8000:8000 ${{ env.IMAGE_NAME }}:ci-${{ github.sha }}
          # wait for /health
          for i in {1..30}; do
            if curl -fs http://localhost:8000/health; then
              echo "API is up"
              break
            fi
            sleep 2
          done
          curl -fs http://localhost:8000/health
          curl -fs -X POST http://localhost:8000/predict \
               -H "Content-Type: application/json" \
               -d '{
                     "age": 63, "sex": 1, "cp": 3, "trestbps": 145,
                     "chol": 233, "fbs": 1, "restecg": 0, "thalach": 150,
                     "exang": 0, "oldpeak": 2.3, "slope": 0, "ca": 0, "thal": 1
                   }'
          docker logs api
          docker stop api && docker rm api
