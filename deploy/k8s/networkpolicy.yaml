apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: heart-disease-api
  namespace: heart-disease
spec:
  podSelector:
    matchLabels:
      app: heart-disease-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 8000
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: TCP
          port: 53
        - protocol: UDP
          port: 53
