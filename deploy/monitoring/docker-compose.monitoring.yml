# Local monitoring stack for the Heart Disease API.
#
# Setup (one-time):
#   cp deploy/monitoring/grafana_admin_password.txt.example \
#      deploy/monitoring/grafana_admin_password.txt
#   # Then edit the file to set your own strong password before starting Grafana.
#
# Run alongside the API container:
#   docker compose -f deploy/monitoring/docker-compose.monitoring.yml up -d
# Grafana   : http://localhost:3000  (admin / <your password>)
# Prometheus: http://localhost:9090
#
# The API container must be reachable at host.docker.internal:8000 from inside
# the Prometheus container; on Linux you may need to add
# `--add-host=host.docker.internal:host-gateway` when starting the API.

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: heart-disease-prometheus
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:11.3.0
    container_name: heart-disease-grafana
    restart: unless-stopped
    user: "472:472"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    secrets:
      - grafana_admin_password
    networks:
      - monitoring
    depends_on:
      - prometheus

volumes:
  prometheus_data: {}
  grafana_data: {}

networks:
  monitoring:
    driver: bridge

secrets:
  grafana_admin_password:
    file: ./grafana_admin_password.txt
